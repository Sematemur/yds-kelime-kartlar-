<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YDS Kelime Kartları</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YDS Kartlar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eef0;--card:#fbfdfd;--ink:#10222b;--mute:#5b6f78;--line:#c9d6da;--ok:#0f766e;--no:#c2410c;--mark:#ffe08a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c171c;--card:#14262d;--ink:#e6f0f2;--mute:#8aa1a9;--line:#27404a;--ok:#2dd4bf;--no:#fb923c;--mark:#6b5a12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c171c;--card:#14262d;--ink:#e6f0f2;--mute:#8aa1a9;--line:#27404a;--ok:#2dd4bf;--no:#fb923c;--mark:#6b5a12;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.app{max-width:640px;margin:0 auto;padding:14px 16px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0;font-weight:700}
.stats{font-size:13px;color:var(--mute)}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button,.btn{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.stage{position:relative;height:min(62vh,440px);perspective:1200px;touch-action:pan-y}
.card{position:absolute;inset:0;touch-action:none;user-select:none;cursor:grab}
.inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;overflow:auto}
.back{transform:rotateY(180deg)}
.front{align-items:center;justify-content:center;text-align:center}
.en{font-size:clamp(34px,9vw,52px);font-weight:700;margin:0;line-height:1.1}
.ok{margin-top:10px;font-family:"Source Serif 4",Georgia,serif;font-style:italic;color:var(--mute);font-size:19px}
.tag{position:absolute;top:14px;right:16px;font-size:20px}
.hint{position:absolute;bottom:14px;font-size:13px;color:var(--mute)}
.tr{font-size:22px;font-weight:700;margin:0 0 12px}
.tr li{margin-bottom:2px}
ol.tr{padding-left:22px;font-size:20px}
.row{font-size:15px;margin:6px 0;line-height:1.4}
.row b{color:var(--mute);font-weight:500;margin-right:6px}
.exs{font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.5;margin-top:10px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.stamp{position:absolute;top:22px;font-size:22px;font-weight:700;padding:4px 12px;border:3px solid;border-radius:10px;opacity:0;pointer-events:none;z-index:2}
.stamp.k{left:22px;color:var(--ok);transform:rotate(-10deg)}
.stamp.d{right:22px;color:var(--no);transform:rotate(10deg)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1;font-weight:700}
.actions .no{border-color:var(--no);color:var(--no)}
.actions .yes{border-color:var(--ok);color:var(--ok)}
.empty{padding:40px 12px;text-align:center;color:var(--mute);line-height:1.6}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.item h3{margin:0 0 4px;font-size:18px}
.item p{margin:4px 0;font-size:15px}
.quiz h2{font-size:34px;margin:6px 0 4px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-size:16px}
.opt.good{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.bad{background:var(--no);color:var(--bg);border-color:var(--no)}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
nav{flex-wrap:wrap;gap:4px}nav button{padding:10px 9px;font-size:14px}
.bk p{font-size:15px;line-height:1.45;margin:0 0 12px}.bk .btn{display:block;width:100%;margin-bottom:10px;background:var(--card)}.bk .msg{color:var(--ok);font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="app">
<header><h1>YDS Kelime Kartları</h1><div class="stats" id="stats"></div></header>
<nav role="tablist"><button role="tab" id="t1" aria-selected="true">Kartlar</button><button role="tab" id="t2" aria-selected="false">Bilemediklerim</button><button role="tab" id="t3" aria-selected="false" aria-label="Yedekle" title="Yedekle">💾</button><button class="btn" id="undo" style="margin-left:auto">↩ Geri</button></nav>
<main id="main"></main>
</div>
<script src="data.js?v=7"></script>
<script src="app.js?v=7"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(console.error))</script>
</body>
</html>
